[tool.black]
target-version = ['py314']


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.pyright]
include = [
    "src/raceway/**/*.py"
]
exclude = [
    "**/__pycache__",
]
venvPath = "." # The directory that contains "all" the virtualenvs
venv = "../ve" # The actual virtualenv I guess?

[tool.hatch]
installer = "pip"

[tool.hatch.env]

[tool.hatch.version]
path = "src/raceway/__version__.py"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
    "src/raceway/*.py",
    "tests/"
]

[tool.hatch.build.targets.wheel]
packages = ["src/raceway"]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pyright",
    "flake8",
    "flake8-bugbear",
    "black",
    "twine",
]

[tool.hatch.envs.default.scripts]
testit="pytest tests"
checkit=["pyright src tests"]
lintit=["flake8 src tests"]
shapeit=["black src tests"]
buildit=[
    "python -m build --wheel",
    "python -m build --sdist",
    "twine check dist/*.whl"
]
tagit=[
    "git tag -a v`hatch version` -m Version' '`hatch version`",
    "git push origin v`hatch version`"
]
releaseit=[
    "twine upload dist/*",
]

[project]
name = "raceway"
description = "Simple dependency injection system. "
readme = "README.rst"
dynamic = ["version"]
dependencies = []
authors = [
  { name="Ian Wilson", email="ian@gardentheory.com" },
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
GitHub="https://github.com/ianjosephwilson/raceway"

[project.optional-dependencies]
venusian = ["venusian"]
